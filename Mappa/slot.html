<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Slot - Fun Casino</title>
  <link rel="stylesheet" href="style.css" />
  <script src="shared.js" defer></script>
  <script src="slot.js" defer></script>
</head>
<body>
  <header>
    <h1>🎰 Casino - Slot</h1>
  </header>

  <main class="game-wrapper container">
    <div class="top-bar">
      <button class="home-btn" onclick="location.href='index.html'">🏠 Main Menu</button>
      <div class="chips">Chips: <span id="chipDisplaySlot">100</span></div>
    </div>

    <div class="card slot-machine">
      <div class="reels">
        <div class="reel" id="reel1">🍒</div>
        <div class="reel" id="reel2">🍋</div>
        <div class="reel" id="reel3">🍊</div>
      </div>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:8px">
        <button id="spinBtn">Spin (-10 chips)</button>
        <button id="resetBtn">Reset (100)</button>
      </div>
      <p id="result" class="result"></p>
    </div>
  </main>
</body>
</html>
