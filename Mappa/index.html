<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kaszi</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="roulette_icon.png">
  <script src="shared.js" defer></script>
</head>
<body>
  <header>
    <h1>🎰 Kaszi</h1>
    <p>Chips: <span id="chipDisplay">100</span></p>
  </header>

  <main class="menu container">
    <h2>Select a game</h2>
    <div class="menu-buttons">
      <button onclick="location.href='slot.html'">🎰 Slot Machine</button>
      <button onclick="location.href='roulette.html'">🎡 Roulette</button>
      <button onclick="location.href='blackjack.html'">🂡 Blackjack</button>
    </div>

    <div style="margin-top:20px;">
      <button class="reset" onclick="resetChips()">🔄 Reset Chips (100)</button>
    </div>

    <p style="margin-top:18px;color:#f3f3f3;opacity:0.9">
      Your chips are saved across all pages (localStorage).
    </p>
  </main>
</body>
</html>
