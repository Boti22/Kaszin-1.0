<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fun Casino</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎰 Fun Casino</h1>
    <p>Induló chip: <span id="chipCount">100</span></p>
  </header>

  <main>
    <div class="slot-machine">
      <div class="reels">
        <div class="reel" id="reel1">🍒</div>
        <div class="reel" id="reel2">🍋</div>
        <div class="reel" id="reel3">🍊</div>
      </div>
      <button id="spinBtn">Pörgetés (-10 chip)</button>
      <button id="resetBtn">Nullázás</button>
      <p id="result"></p>
    </div>
  </main>

  <footer>
    <p>💡 Tipp: Ha elfogy a chip, nullázhatod és újraindul 100-ról.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
